      Sem canonical, og:url e og:image enquanto o domínio de publicação não for
      confirmado: uma URL inventada é pior do que a ausência da tag.
      twitter:card é "summary" justamente por não haver imagem social real.
    -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      /*
       * Tema e idioma antes da primeira pintura, para não haver flash.
       * Este script e o ThemeContext precisam concordar no padrão (claro).
       * Envolto em try/catch: em modo privado ou com armazenamento bloqueado,
       * só ler localStorage já lança — e uma exceção aqui deixaria a página em
       * branco. Sem armazenamento, valem os padrões (escuro, português).
       */
      (function () {
        var theme = 'light';
        var lang = null;
        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark') theme = 'dark';
          var savedLang = localStorage.getItem('lang');
          if (savedLang === 'pt' || savedLang === 'en') lang = savedLang;
        } catch (error) {
          /* armazenamento indisponível: seguir com os padrões */
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.lang = lang === 'en' ? 'en' : 'pt-BR';
      })();
    </script>
